# Builds and deploys the site to GitHub Pages.
#
# Besides the files in the repo, the site has one page per discussion labeled
# "wirwtw" (generated by .github/scripts/build-wirwtw.mjs), so it is rebuilt
# whenever a discussion changes, not only on pushes.
name: Deploy site

# Names each run after its trigger. One example per trigger, with "WIRWTW #2"
# standing in for the discussion title:
#
#   push               Update README (#6)
#   workflow_dispatch  Deploy site
#   created            Discussion #5 created: WIRWTW #2
#   edited             Discussion #5 edited: WIRWTW #2
#   deleted            Discussion #5 deleted: WIRWTW #2
#   transferred        Discussion #5 transferred: WIRWTW #2
#   labeled            Discussion #5 labeled "wirwtw": WIRWTW #2
#   unlabeled          Discussion #5 unlabeled "wirwtw": WIRWTW #2
#
# For pushes and manual runs the expression is empty, so GitHub uses its
# default: the first line of the commit message, or the workflow name.
run-name: >-
  ${{ github.event_name == 'discussion' && format(
  'Discussion #{0} {1}{2}: {3}',
  github.event.discussion.number,
  github.event.action,
  github.event.label && format(' "{0}"', github.event.label.name) || '',
  github.event.discussion.title
  ) || '' }}

on:
  push:
    branches: [main]
  discussion:
    types: [created, edited, deleted, transferred, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

# Every run rebuilds from the current repo and discussions, so a newer queued
# run can safely replace an older queued one. Discussion events are
# deliberately not filtered by label: a skipped run would still take that
# queue slot and drop the update it replaced.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: pages
        uses: actions/configure-pages@v6

      - name: Generate WIRWTW pages from discussions
        run: node .github/scripts/build-wirwtw.mjs .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      # Same Jekyll build the "Deploy from a branch" source runs, so README.md
      # stays the home page and hand-written files are published as before.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
